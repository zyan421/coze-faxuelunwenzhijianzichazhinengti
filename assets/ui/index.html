<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>法学论文质检自查智能体</title>
<style>
  :root {
    --xtu-primary: #9F191E;
    --xtu-primary-light: #C44549;
    --xtu-primary-pale: #F5E9E9;
    --xtu-accent-gold: #B8860B;
    --xtu-bg: #FAFAFA;
    --xtu-surface: #FFFFFF;
    --xtu-text: #2C2C2C;
    --xtu-text-secondary: #666666;
    --xtu-text-hint: #999999;
    --xtu-border: #E8E0E0;
    --xtu-shadow: 0 2px 16px rgba(159,25,30,0.06);
    --xtu-radius: 12px;
    --green: #2E7D32;
    --green-pale: #E8F5E9;
    --blue: #1565C0;
    --blue-pale: #E3F2FD;
    --orange: #E65100;
    --orange-pale: #FFF3E0;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: "PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
    background: var(--xtu-bg); color: var(--xtu-text);
    font-size: 18px; line-height: 1.8;
    min-height: 100vh; display: flex; flex-direction: column;
  }

  /* ========== 顶部导航 ========== */
  .topbar {
    background: var(--xtu-surface);
    padding: 0 32px; height: 80px;
    display: flex; align-items: center; gap: 16px;
    border-bottom: 3px solid var(--xtu-primary);
    position: sticky; top: 0; z-index: 100;
  }
  .topbar-logo {
    height: 60px; flex-shrink: 0;
    /* 不使用filter，保留原始红色校徽 */
  }
  .topbar-center {
    flex: 1; text-align: center;
  }
  .topbar-title {
    color: var(--xtu-primary); font-size: 22px; font-weight: 700;
    letter-spacing: 3px;
  }
  .topbar-subtitle-en {
    color: var(--xtu-text-hint); font-size: 12px; letter-spacing: 0.5px; margin-top: 2px;
  }
  .topbar-right {
    color: var(--xtu-primary); font-size: 14px; font-weight: 500;
    letter-spacing: 1px; flex-shrink: 0;
  }

  /* ========== 主内容区 ========== */
  .main-container {
    flex: 1; display: flex; flex-direction: column;
    max-width: 960px; width: 100%; margin: 0 auto; padding: 32px 24px 0;
  }

  /* ========== 欢迎区域 ========== */
  .welcome-section { text-align: center; padding: 48px 24px 36px; }
  .welcome-title { font-size: 32px; font-weight: 700; color: var(--xtu-primary); margin-bottom: 12px; letter-spacing: 3px; }
  .welcome-slogan { font-size: 20px; color: var(--xtu-text-secondary); letter-spacing: 1px; font-weight: 400; }
  .welcome-slogan::before, .welcome-slogan::after { content: " · "; color: var(--xtu-accent-gold); }
  .deco-icons { display: flex; justify-content: center; gap: 40px; padding: 24px 0 32px; opacity: 0.18; }
  .deco-icons svg { width: 48px; height: 48px; stroke: var(--xtu-primary); fill: none; stroke-width: 1.2; }

  /* ========== 对话区 ========== */
  .chat-area { flex: 1; overflow-y: auto; padding: 16px 0; }
  .msg-row { display: flex; margin-bottom: 20px; gap: 12px; animation: fadeIn 0.35s ease; }
  .msg-row.user { justify-content: flex-end; }
  .msg-row.assistant { justify-content: flex-start; }
  .msg-avatar {
    width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: 700; color: #fff;
  }
  .msg-row.user .msg-avatar { background: var(--xtu-accent-gold); }
  .msg-row.assistant .msg-avatar { background: var(--xtu-primary); }
  .msg-bubble {
    max-width: 72%; padding: 16px 20px; border-radius: var(--xtu-radius);
    font-size: 18px; line-height: 1.85; white-space: pre-wrap; word-break: break-word;
  }
  .msg-row.user .msg-bubble { background: var(--xtu-primary); color: #fff; border-bottom-right-radius: 4px; }
  .msg-row.assistant .msg-bubble {
    background: var(--xtu-surface); color: var(--xtu-text);
    border: 1px solid var(--xtu-border); border-bottom-left-radius: 4px; box-shadow: var(--xtu-shadow);
  }
  .msg-bubble a { color: var(--xtu-primary); text-decoration: underline; text-underline-offset: 3px; }

  /* ========== 进度面板 ========== */
  .progress-panel {
    max-width: 72%; padding: 16px 20px; border-radius: var(--xtu-radius);
    background: var(--xtu-surface); border: 1px solid var(--xtu-border);
    box-shadow: var(--xtu-shadow); font-size: 16px; line-height: 1.6;
  }
  .progress-panel .progress-title {
    font-weight: 700; color: var(--xtu-primary); margin-bottom: 10px;
    font-size: 17px; display: flex; align-items: center; gap: 8px;
  }
  .progress-panel .progress-title .spinner {
    display: inline-block; width: 16px; height: 16px;
    border: 2.5px solid var(--xtu-primary-pale); border-top-color: var(--xtu-primary);
    border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  .progress-panel .step-list { list-style: none; padding: 0; margin: 0; }
  .progress-panel .step-item {
    padding: 6px 0; display: flex; align-items: center; gap: 8px;
    color: var(--xtu-text-secondary); font-size: 15px;
  }
  .progress-panel .step-item .step-icon { flex-shrink: 0; width: 20px; text-align: center; }
  .progress-panel .step-item.active { color: var(--xtu-primary); font-weight: 600; }
  .progress-panel .step-item.done { color: var(--green); }
  .progress-panel .step-item.pending { color: var(--xtu-text-hint); }
  .progress-panel .elapsed {
    margin-top: 8px; font-size: 14px; color: var(--xtu-text-hint); text-align: right;
  }
  .progress-panel .heartbeat {
    margin-top: 6px; font-size: 13px; color: var(--blue); text-align: center;
    padding: 4px 0; animation: pulse 2s ease-in-out infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 0%,100%{opacity:0.6} 50%{opacity:1} }
  @keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

  /* ========== 输入区 ========== */
  .input-section {
    padding: 20px 0 28px; position: sticky; bottom: 0;
    background: linear-gradient(to top, var(--xtu-bg) 85%, transparent); z-index: 10;
  }
  .input-hint { text-align: center; font-size: 15px; color: var(--xtu-text-hint); margin-bottom: 10px; letter-spacing: 0.5px; }
  .input-hint strong { color: var(--xtu-primary); font-weight: 600; }
  .input-row { display: flex; gap: 10px; align-items: flex-end; }
  .btn-upload {
    width: 56px; height: 56px; border-radius: var(--xtu-radius);
    border: 2px dashed var(--xtu-border); background: var(--xtu-surface);
    color: var(--xtu-text-hint); font-size: 26px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.25s; flex-shrink: 0; user-select: none;
  }
  .btn-upload:hover { border-color: var(--xtu-primary-light); color: var(--xtu-primary); }
  .btn-upload.has-file { border-color: var(--green); border-style: solid; color: var(--green); background: var(--green-pale); }
  .hidden-file-input { position: absolute; width: 0; height: 0; opacity: 0; pointer-events: none; }
  .input-wrapper { flex: 1; position: relative; }
  .input-wrapper textarea {
    width: 100%; min-height: 56px; max-height: 180px;
    padding: 14px 18px; font-size: 18px; line-height: 1.7;
    border: 2px solid var(--xtu-border); border-radius: var(--xtu-radius);
    background: var(--xtu-surface); color: var(--xtu-text);
    resize: none; outline: none; transition: border-color 0.2s; font-family: inherit;
  }
  .input-wrapper textarea:focus { border-color: var(--xtu-primary-light); }
  .input-wrapper textarea::placeholder { color: var(--xtu-text-hint); }
  .input-wrapper.drag-over textarea { border-color: var(--green); background: var(--green-pale); }
  .btn-send {
    width: 56px; height: 56px; border-radius: var(--xtu-radius); border: none;
    background: var(--xtu-primary); color: #fff; font-size: 22px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s, opacity 0.2s; flex-shrink: 0;
  }
  .btn-send:hover { background: var(--xtu-primary-light); }
  .btn-send:disabled { opacity: 0.4; cursor: not-allowed; }

  .file-preview {
    display: none; align-items: center; gap: 8px;
    background: var(--green-pale); border: 1px solid var(--green);
    border-radius: 8px; padding: 8px 14px; margin-bottom: 8px;
    font-size: 16px; color: var(--green); animation: fadeIn 0.3s ease;
  }
  .file-preview.visible { display: flex; }
  .file-preview-name { flex: 1; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file-preview-size { color: var(--xtu-text-hint); font-size: 14px; flex-shrink: 0; }
  .file-preview-remove {
    cursor: pointer; font-weight: 700; font-size: 18px;
    color: var(--xtu-text-hint); margin-left: 4px; transition: color 0.2s; flex-shrink: 0;
  }
  .file-preview-remove:hover { color: var(--xtu-primary); }

  /* ========== 设置按钮 ========== */
  .btn-settings {
    position: absolute; right: 16px; top: 50%; transform: translateY(-50%);
    width: 36px; height: 36px; border-radius: 50%; border: none;
    background: rgba(255,255,255,0.15); color: #fff; font-size: 20px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: background 0.2s;
  }
  .btn-settings:hover { background: rgba(255,255,255,0.3); }

  /* ========== 设置弹窗 ========== */
  .modal-overlay {
    display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.5); z-index: 1000;
    align-items: center; justify-content: center;
  }
  .modal-overlay.visible { display: flex; }
  .modal {
    background: #fff; border-radius: 16px; padding: 32px;
    width: 90%; max-width: 520px; box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    animation: fadeIn 0.25s ease;
  }
  .modal h2 { margin: 0 0 6px; font-size: 22px; color: var(--xtu-primary); }
  .modal .modal-desc { font-size: 15px; color: var(--xtu-text-hint); margin-bottom: 20px; line-height: 1.6; }
  .modal label { display: block; font-size: 15px; font-weight: 600; color: var(--xtu-text); margin-bottom: 6px; margin-top: 14px; }
  .modal label .hint { font-weight: 400; color: var(--xtu-text-hint); font-size: 13px; }
  .modal input[type="text"], .modal input[type="password"] {
    width: 100%; padding: 10px 14px; font-size: 16px; border: 2px solid var(--xtu-border);
    border-radius: 8px; outline: none; transition: border-color 0.2s; box-sizing: border-box;
  }
  .modal input:focus { border-color: var(--xtu-primary-light); }
  .modal .preset-btns { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .modal .preset-btn {
    padding: 6px 14px; border-radius: 20px; border: 1.5px solid var(--xtu-border);
    background: #fff; color: var(--xtu-text); font-size: 14px; cursor: pointer;
    transition: all 0.2s;
  }
  .modal .preset-btn:hover { border-color: var(--xtu-primary); color: var(--xtu-primary); }
  .modal .preset-btn.active { border-color: var(--xtu-primary); background: var(--xtu-primary-pale); color: var(--xtu-primary); font-weight: 600; }
  .modal .modal-actions { display: flex; gap: 12px; margin-top: 24px; justify-content: flex-end; }
  .modal .btn-cancel {
    padding: 10px 24px; border-radius: 8px; border: 1.5px solid var(--xtu-border);
    background: #fff; color: var(--xtu-text); font-size: 16px; cursor: pointer;
  }
  .modal .btn-save {
    padding: 10px 24px; border-radius: 8px; border: none;
    background: var(--xtu-primary); color: #fff; font-size: 16px; cursor: pointer;
    font-weight: 600; transition: background 0.2s;
  }
  .modal .btn-save:hover { background: var(--xtu-primary-light); }
  .modal .btn-save:disabled { opacity: 0.5; cursor: not-allowed; }
  .modal .status-line { margin-top: 10px; font-size: 14px; color: var(--xtu-text-hint); }
  .modal .status-line.ok { color: var(--green); }
  .modal .status-line.err { color: var(--xtu-primary); }
  .modal .key-row { display: flex; gap: 8px; }
  .modal .key-row input { flex: 1; }
  .modal .toggle-vis {
    width: 42px; height: 42px; border: 2px solid var(--xtu-border); border-radius: 8px;
    background: #fff; font-size: 18px; cursor: pointer; display: flex; align-items: center;
    justify-content: center; flex-shrink: 0;
  }

  @media (max-width: 640px) {
    .main-container { padding: 16px 12px 0; }
    .welcome-title { font-size: 24px; } .welcome-slogan { font-size: 16px; }
    .msg-bubble, .progress-panel { max-width: 85%; font-size: 16px; }
    .topbar-title { font-size: 18px; } .topbar-right { display: none; }
    .topbar { height: 64px; padding: 0 16px; }
    .topbar-logo { height: 44px; }
  }
</style>
</head>
<body>

<div class="topbar">
  <img src="https://law.xtu.edu.cn/v24/images/head/logo.png" alt="湘潭大学法学学部" class="topbar-logo" onerror="this.style.display='none'">
  <div class="topbar-center">
    <div class="topbar-title">法学论文质检自查智能体</div>
    <div class="topbar-subtitle-en">Legal Thesis Quality Inspection System</div>
  </div>
  <span class="topbar-right">湘潭大学法学学部</span>
  <button class="btn-settings" id="btnSettings" type="button" title="模型设置">⚙</button>
</div>

<div class="main-container">
  <div class="welcome-section" id="welcomeSection">
    <div class="welcome-title">法学论文质检自查智能体</div>
    <div class="welcome-slogan">让沟通聚焦学术真问题，让论文写作提质增效</div>
    <div class="deco-icons">
      <svg viewBox="0 0 24 24"><path d="M12 3v18M3 7l9-4 9 4M3 7l3 7h0a3 3 0 006 0h0l-3-7M21 7l-3 7h0a3 3 0 01-6 0h0l3-7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 016.5 17H20M4 19.5V5a2.5 2.5 0 012.5-2.5H20v15M4 19.5A2.5 2.5 0 006.5 22H20V7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65" stroke-linecap="round"/></svg>
      <svg viewBox="0 0 24 24"><path d="M17 3a2.85 2.85 0 114 4L7.5 20.5 2 22l1.5-5.5Z" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
  </div>

  <!-- 模型设置弹窗 -->
  <div class="modal-overlay" id="settingsModal">
    <div class="modal">
      <h2>⚙ 模型设置</h2>
      <p class="modal-desc">使用您自己的大模型 API，按实际消耗计费。<br>智能体内核与工具链免费提供，模型 tokens 消费由您掌控。</p>
      <label>模型名称 <span class="hint">（如 deepseek-chat）</span></label>
      <div class="preset-btns" id="presetBtns">
        <button class="preset-btn" data-model="deepseek-chat" data-url="https://api.deepseek.com/v1">DeepSeek</button>
        <button class="preset-btn" data-model="qwen-plus" data-url="https://dashscope.aliyuncs.com/compatible-mode/v1">通义千问</button>
        <button class="preset-btn" data-model="glm-4-flash" data-url="https://open.bigmodel.cn/api/paas/v4">智谱GLM</button>
        <button class="preset-btn" data-model="doubao-1-5-pro-32k-250115" data-url="">豆包</button>
        <button class="preset-btn" data-model="kimi-k2-5-260127" data-url="">Kimi</button>
      </div>
      <input type="text" id="inputModel" placeholder="deepseek-chat" autocomplete="off">
      <label>API Base URL <span class="hint">（OpenAI 兼容格式）</span></label>
      <input type="text" id="inputBaseUrl" placeholder="https://api.deepseek.com/v1" autocomplete="off">
      <label>API Key</label>
      <div class="key-row">
        <input type="password" id="inputApiKey" placeholder="sk-xxxxxxxx" autocomplete="off">
        <button class="toggle-vis" id="toggleKeyVis" type="button">👁</button>
      </div>
      <div class="status-line" id="settingsStatus"></div>
      <div class="modal-actions">
        <button class="btn-cancel" id="btnCancelSettings">取消</button>
        <button class="btn-save" id="btnSaveSettings">保存设置</button>
      </div>
    </div>
  </div>

  <div class="chat-area" id="chatArea"></div>
  <div class="input-section">
    <div class="input-hint">
      在此上传您的论文初稿，支持格式 <strong>.docx .pdf .txt .md</strong> &nbsp;|&nbsp;
      也可直接输入论文路径或文本内容
    </div>
    <div class="file-preview" id="filePreview">
      <span>📄</span>
      <span class="file-preview-name" id="filePreviewName"></span>
      <span class="file-preview-size" id="filePreviewSize"></span>
      <span class="file-preview-remove" id="filePreviewRemove" title="移除文件">✕</span>
    </div>
    <div class="input-row">
      <button class="btn-upload" id="btnUpload" type="button" title="上传论文文件">＋</button>
      <input type="file" id="fileInput" class="hidden-file-input" accept=".docx,.pdf,.txt,.md">
      <div class="input-wrapper" id="inputWrapper">
        <textarea id="msgInput" rows="1" placeholder="请输入论文路径，或直接粘贴论文文本…"></textarea>
      </div>
      <button class="btn-send" id="btnSend" type="button" title="发送">➤</button>
    </div>
  </div>
</div>

<script>
(function() {
  'use strict';

  /* ===== 工具名中文映射 ===== */
  var TOOL_LABELS = {
    'read_paper_file':             '📖 读取论文文件',
    'normalize_issues_for_annotation': '📋 标准化审查问题',
    'generate_annotated_docx':     '📝 生成批注文档',
    'generate_markdown_report':    '📊 生成审查报告',
    'verify_fact':                 '🔍 联网核实',
    'web_search':                  '🔍 联网搜索',
  };
  function toolLabel(name) {
    return TOOL_LABELS[name] || ('🔧 ' + name);
  }

  /* ===== 设置面板逻辑 ===== */
  var settingsModal = document.getElementById('settingsModal');
  var btnSettings = document.getElementById('btnSettings');
  var btnCancel = document.getElementById('btnCancelSettings');
  var btnSave = document.getElementById('btnSaveSettings');
  var inputModel = document.getElementById('inputModel');
  var inputBaseUrl = document.getElementById('inputBaseUrl');
  var inputApiKey = document.getElementById('inputApiKey');
  var toggleKeyVis = document.getElementById('toggleKeyVis');
  var settingsStatus = document.getElementById('settingsStatus');
  var presetBtns = document.querySelectorAll('.preset-btn');

  function openSettings() { settingsModal.classList.add('visible'); loadCurrentConfig(); }
  function closeSettings() { settingsModal.classList.remove('visible'); settingsStatus.textContent = ''; }
  btnSettings.addEventListener('click', openSettings);
  btnCancel.addEventListener('click', closeSettings);
  settingsModal.addEventListener('click', function(e) { if (e.target === settingsModal) closeSettings(); });

  toggleKeyVis.addEventListener('click', function() {
    inputApiKey.type = inputApiKey.type === 'password' ? 'text' : 'password';
  });

  presetBtns.forEach(function(btn) {
    btn.addEventListener('click', function() {
      presetBtns.forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      inputModel.value = btn.dataset.model;
      if (btn.dataset.url) inputBaseUrl.value = btn.dataset.url;
    });
  });

  function loadCurrentConfig() {
    fetch('/api/model-config').then(function(r) { return r.json(); }).then(function(data) {
      if (data.config && data.config.custom_model) {
        var cm = data.config.custom_model;
        inputModel.value = cm.model || '';
        inputBaseUrl.value = cm.base_url || '';
        inputApiKey.value = cm.api_key ? '••••••••' : '';
        settingsStatus.textContent = '当前模型: ' + (cm.model || '平台默认');
        settingsStatus.className = 'status-line ok';
        // highlight matching preset
        presetBtns.forEach(function(b) { b.classList.toggle('active', b.dataset.model === cm.model); });
      } else {
        inputModel.value = ''; inputBaseUrl.value = ''; inputApiKey.value = '';
        settingsStatus.textContent = '当前使用平台默认模型';
        settingsStatus.className = 'status-line';
      }
    }).catch(function() {});
  }

  btnSave.addEventListener('click', function() {
    var model = inputModel.value.trim();
    var base_url = inputBaseUrl.value.trim();
    var api_key = inputApiKey.value.trim();
    if (!model) { settingsStatus.textContent = '请填写模型名称'; settingsStatus.className = 'status-line err'; return; }
    if (api_key === '••••••••') api_key = ''; // keep existing if not changed
    settingsStatus.textContent = '保存中...'; settingsStatus.className = 'status-line';
    btnSave.disabled = true;
    fetch('/api/model-config', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model: model, base_url: base_url, api_key: api_key })
    }).then(function(r) { return r.json(); }).then(function(data) {
      if (data.success) {
        settingsStatus.textContent = '✅ 保存成功！模型: ' + model;
        settingsStatus.className = 'status-line ok';
        setTimeout(closeSettings, 1200);
      } else {
        settingsStatus.textContent = '❌ 保存失败: ' + (data.error || '未知错误');
        settingsStatus.className = 'status-line err';
      }
    }).catch(function(e) {
      settingsStatus.textContent = '❌ 网络错误';
      settingsStatus.className = 'status-line err';
    }).finally(function() { btnSave.disabled = false; });
  });

  /* ===== DOM ===== */
  var chatArea = document.getElementById('chatArea');
  var msgInput = document.getElementById('msgInput');
  var btnSend  = document.getElementById('btnSend');
  var btnUpload = document.getElementById('btnUpload');
  var fileInput = document.getElementById('fileInput');
  var inputWrapper = document.getElementById('inputWrapper');
  var filePreview = document.getElementById('filePreview');
  var filePreviewName = document.getElementById('filePreviewName');
  var filePreviewSize = document.getElementById('filePreviewSize');
  var filePreviewRemove = document.getElementById('filePreviewRemove');
  var welcomeSection = document.getElementById('welcomeSection');

  /* ===== 状态 ===== */
  var pendingFile = null;
  var pendingFilePath = null;
  var sessionId = genSid();
  var isSending = false;

  /* ===== 进度追踪 ===== */
  var progressRow = null;
  var progressPanel = null;
  var stepItems = {};
  var currentToolName = '';
  var streamStartTime = 0;
  var elapsedTimer = null;
  var lastEventTime = 0;
  var heartbeatTimer = null;

  /* ===== 工具函数 ===== */
  function genSid() { return 'sess_' + Math.random().toString(36).slice(2, 10); }
  function scrollToBottom() { chatArea.scrollTop = chatArea.scrollHeight; }
  function hideWelcome() { if (welcomeSection) welcomeSection.style.display = 'none'; }
  function formatSize(b) {
    if (b < 1024) return b + ' B';
    if (b < 1048576) return (b/1024).toFixed(1) + ' KB';
    return (b/1048576).toFixed(1) + ' MB';
  }

  /* ===== 消息渲染 ===== */
  function addMessage(role, text) {
    hideWelcome();
    var row = document.createElement('div');
    row.className = 'msg-row ' + role;
    var avatar = document.createElement('div');
    avatar.className = 'msg-avatar';
    avatar.textContent = role === 'user' ? '您' : '法';
    var bubble = document.createElement('div');
    bubble.className = 'msg-bubble';
    bubble.innerHTML = formatMd(text);
    row.appendChild(avatar);
    row.appendChild(bubble);
    chatArea.appendChild(row);
    scrollToBottom();
    return bubble;
  }

  function formatMd(text) {
    if (typeof text !== 'string') return '';
    return text
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
      .replace(/`(.*?)`/g, '<code style="background:#f0f0f0;padding:2px 6px;border-radius:4px;font-size:0.9em">$1</code>')
      .replace(/\n/g, '<br>')
      .replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank">$1</a>');
  }

  /* ===== 进度面板 ===== */
  function createProgressPanel() {
    removeProgressPanel();
    hideWelcome();
    progressRow = document.createElement('div');
    progressRow.className = 'msg-row assistant';
    var avatar = document.createElement('div');
    avatar.className = 'msg-avatar';
    avatar.textContent = '法';
    progressPanel = document.createElement('div');
    progressPanel.className = 'progress-panel';
    progressPanel.innerHTML =
      '<div class="progress-title"><span class="spinner"></span> 正在连接智能体…</div>' +
      '<ul class="step-list"></ul>' +
      '<div class="heartbeat" id="heartbeatMsg"></div>' +
      '<div class="elapsed" id="elapsedTime"></div>';
    progressRow.appendChild(avatar);
    progressRow.appendChild(progressPanel);
    chatArea.appendChild(progressRow);
    stepItems = {};
    streamStartTime = Date.now();
    lastEventTime = Date.now();
    startElapsedTimer();
    startHeartbeat();
    scrollToBottom();
  }

  function setProgressTitle(html) {
    if (!progressPanel) return;
    var title = progressPanel.querySelector('.progress-title');
    if (title) title.innerHTML = html;
  }

  function addProgressStep(toolName) {
    if (!progressPanel) return;
    if (!progressPanel.querySelector('.progress-title')) {
      progressPanel.innerHTML =
        '<div class="progress-title"><span class="spinner"></span> 审查进行中…</div>' +
        '<ul class="step-list"></ul>' +
        '<div class="heartbeat" id="heartbeatMsg"></div>' +
        '<div class="elapsed" id="elapsedTime"></div>';
    }
    if (stepItems[toolName]) {
      stepItems[toolName].className = 'step-item active';
      stepItems[toolName].querySelector('.step-icon').textContent = '⏳';
      scrollToBottom();
      return;
    }
    var list = progressPanel.querySelector('.step-list');
    var li = document.createElement('li');
    li.className = 'step-item active';
    li.innerHTML = '<span class="step-icon">⏳</span> ' + toolLabel(toolName);
    list.appendChild(li);
    stepItems[toolName] = li;
    scrollToBottom();
  }

  function completeProgressStep(toolName, duration) {
    if (!stepItems[toolName]) return;
    stepItems[toolName].className = 'step-item done';
    var durText = duration ? (' (' + duration + ')') : '';
    stepItems[toolName].querySelector('.step-icon').textContent = '✅';
    stepItems[toolName].innerHTML =
      '<span class="step-icon">✅</span> ' + toolLabel(toolName) + durText;
    scrollToBottom();
  }

  function finishProgress() {
    stopElapsedTimer();
    stopHeartbeat();
    if (!progressPanel) return;
    var totalSec = Math.round((Date.now() - streamStartTime) / 1000);
    var m = Math.floor(totalSec / 60), s = totalSec % 60;
    var timeStr = m > 0 ? (m + '分' + s + '秒') : (s + '秒');
    setProgressTitle('✅ 审查完成（共耗时 ' + timeStr + '）');
    Object.keys(stepItems).forEach(function(k) {
      if (stepItems[k].classList.contains('active')) {
        stepItems[k].className = 'step-item done';
        stepItems[k].querySelector('.step-icon').textContent = '✅';
      }
    });
    var hb = document.getElementById('heartbeatMsg');
    if (hb) hb.style.display = 'none';
    scrollToBottom();
  }

  function removeProgressPanel() {
    if (progressRow) { progressRow.remove(); progressRow = null; progressPanel = null; }
    stopElapsedTimer();
    stopHeartbeat();
  }

  /* ===== 计时器 ===== */
  function startElapsedTimer() {
    stopElapsedTimer();
    elapsedTimer = setInterval(function() {
      var el = document.getElementById('elapsedTime');
      if (!el) return;
      var sec = Math.round((Date.now() - streamStartTime) / 1000);
      var m = Math.floor(sec / 60), s = sec % 60;
      el.textContent = '已用时 ' + (m > 0 ? m + '分' : '') + s + '秒';
    }, 1000);
  }
  function stopElapsedTimer() { if (elapsedTimer) { clearInterval(elapsedTimer); elapsedTimer = null; } }

  /* ===== 心跳检测：当无SSE事件超过8秒时，显示安抚提示 ===== */
  function startHeartbeat() {
    stopHeartbeat();
    heartbeatTimer = setInterval(function() {
      var hb = document.getElementById('heartbeatMsg');
      if (!hb) return;
      var idleSec = Math.round((Date.now() - lastEventTime) / 1000);
      if (idleSec >= 8) {
        var msgs = [
          '🧠 智能体正在深度分析论文，请耐心等待…',
          '📖 正在对论文九大维度逐一审查，内容较多需要时间…',
          '⚡ 大模型正在思考中，论文越长分析越久…',
          '🔍 正在逐段检索问题并生成批注建议…',
          '⏳ 审查仍在进行中，请勿关闭页面…',
        ];
        var idx = Math.floor(idleSec / 15) % msgs.length;
        hb.textContent = msgs[idx];
        hb.style.display = 'block';
      } else {
        hb.style.display = 'none';
      }
    }, 3000);
  }
  function stopHeartbeat() { if (heartbeatTimer) { clearInterval(heartbeatTimer); heartbeatTimer = null; } }
  function touchHeartbeat() { lastEventTime = Date.now(); var hb = document.getElementById('heartbeatMsg'); if (hb) hb.style.display = 'none'; }

  /* ===== 文件选择 ===== */
  btnUpload.addEventListener('click', function() { fileInput.value = ''; fileInput.click(); });
  fileInput.addEventListener('change', onFileSelected);
  fileInput.addEventListener('input', onFileSelected);

  function onFileSelected() {
    var files = fileInput.files;
    if (!files || !files.length) return;
    var file = files[0];
    pendingFile = file;
    pendingFilePath = null;
    filePreviewName.textContent = file.name;
    filePreviewSize.textContent = formatSize(file.size);
    filePreview.classList.add('visible');
    btnUpload.textContent = '✓';
    btnUpload.classList.add('has-file');
    msgInput.placeholder = '文件已就绪，点击发送开始审查，或输入补充说明…';
    msgInput.focus();
  }

  filePreviewRemove.addEventListener('click', clearFile);
  function clearFile() {
    pendingFile = null; pendingFilePath = null; fileInput.value = '';
    filePreview.classList.remove('visible');
    btnUpload.textContent = '＋'; btnUpload.classList.remove('has-file');
    msgInput.placeholder = '请输入论文路径，或直接粘贴论文文本…';
  }

  /* 拖拽 */
  inputWrapper.addEventListener('dragover', function(e) { e.preventDefault(); inputWrapper.classList.add('drag-over'); });
  inputWrapper.addEventListener('dragleave', function() { inputWrapper.classList.remove('drag-over'); });
  inputWrapper.addEventListener('drop', function(e) {
    e.preventDefault(); inputWrapper.classList.remove('drag-over');
    var files = e.dataTransfer && e.dataTransfer.files;
    if (files && files.length) {
      pendingFile = files[0]; pendingFilePath = null;
      filePreviewName.textContent = pendingFile.name;
      filePreviewSize.textContent = formatSize(pendingFile.size);
      filePreview.classList.add('visible');
      btnUpload.textContent = '✓'; btnUpload.classList.add('has-file');
      msgInput.placeholder = '文件已就绪，点击发送开始审查，或输入补充说明…';
      msgInput.focus();
    }
  });

  /* ===== 上传文件 ===== */
  function uploadFileToServer(file) {
    var fd = new FormData(); fd.append('file', file);
    return fetch('/upload', { method: 'POST', body: fd })
      .then(function(r) { if (!r.ok) throw new Error('上传失败 (HTTP ' + r.status + ')'); return r.json(); })
      .then(function(r) { if (r.success && r.file_path) return r.file_path; throw new Error(r.error || '上传返回异常'); });
  }

  /* ===== 发送 ===== */
  function sendMessage() {
    if (isSending) return;
    var text = msgInput.value.trim();

    if (pendingFile) {
      isSending = true; btnSend.disabled = true;
      var fname = pendingFile.name;
      addMessage('user', '📄 上传文件：' + fname + (text ? '\n' + text : ''));
      createProgressPanel();
      addProgressStep('_upload');
      setProgressTitle('<span class="spinner"></span> 正在上传文件…');

      uploadFileToServer(pendingFile)
        .then(function(path) {
          completeProgressStep('_upload');
          pendingFilePath = path;
          var q = '请审查这篇论文：' + path + (text ? '\n' + text : '');
          clearFile();
          setProgressTitle('<span class="spinner"></span> 智能体正在审查论文…');
          return streamCall(q);
        })
        .catch(function(err) {
          removeProgressPanel();
          addMessage('assistant', '❌ 文件上传失败：' + err.message + '\n\n💡 建议：\n1. 检查网络连接后重试\n2. 或直接在输入框中粘贴论文的文件路径\n3. 或直接粘贴论文文本内容');
          clearFile();
        })
        .finally(function() { isSending = false; btnSend.disabled = false; });

      msgInput.value = '';
      return;
    }

    if (!text) return;
    isSending = true; btnSend.disabled = true;
    addMessage('user', text);
    msgInput.value = '';
    createProgressPanel();

    streamCall(text)
      .catch(function(err) {
        removeProgressPanel();
        addMessage('assistant', '❌ 请求失败：' + err.message + '\n\n💡 请稍后重试，或刷新页面重新开始。');
      })
      .finally(function() { isSending = false; btnSend.disabled = false; });
  }

  btnSend.addEventListener('click', sendMessage);
  msgInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });

  /* ===== 流式调用 (SSE) ===== */
  function streamCall(query) {
    var responseBubble = addMessage('assistant', '');
    responseBubble.innerHTML = '<span class="typing-indicator"><span></span><span></span><span></span></span>';
    var fullText = '';
    var hasAnswer = false;
    var stepStartTimes = {};

    var payload = {
      type: 'query', session_id: sessionId,
      content: { query: { prompt: [{ type: 'text', content: { text: query } }] } }
    };

    return fetch('/stream_run', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    })
    .then(function(resp) {
      if (!resp.ok) throw new Error('服务器返回错误 (HTTP ' + resp.status + ')');
      return readSSE(resp, function(evt) {
        touchHeartbeat();

        /* --- answer --- */
        if (evt.type === 'answer') {
          hasAnswer = true;
          // 隐藏进度面板
          if (progressPanel && progressRow) {
            finishProgress();
            progressRow.style.display = 'none';
          }
          fullText += evt.text;
          responseBubble.innerHTML = formatMd(fullText);
          scrollToBottom();
          return;
        }

        /* --- tool_request --- */
        if (evt.type === 'tool_request') {
          var name = evt.toolName || '';
          if (name) {
            currentToolName = name;
            stepStartTimes[name] = Date.now();
            addProgressStep(name);
            setProgressTitle('<span class="spinner"></span> ' + toolLabel(name) + '…');
          }
          return;
        }

        /* --- tool_response --- */
        if (evt.type === 'tool_response') {
          if (currentToolName) {
            var dur = '';
            if (stepStartTimes[currentToolName]) {
              var sec = Math.round((Date.now() - stepStartTimes[currentToolName]) / 1000);
              dur = sec >= 60 ? (Math.floor(sec/60) + '分' + sec%60 + '秒') : (sec + '秒');
            }
            completeProgressStep(currentToolName, dur);
            currentToolName = '';
          }
          scrollToBottom();
          return;
        }

        /* --- message_end --- */
        if (evt.type === 'message_end') {
          finishProgress();
          if (progressRow) progressRow.style.display = 'none';
          if (!hasAnswer && !fullText) {
            responseBubble.innerHTML = formatMd('审查完成，但未收到文本回复。请尝试重新发送。');
          } else {
            responseBubble.innerHTML = formatMd(fullText);
          }
          scrollToBottom();
          return;
        }

        /* --- error --- */
        if (evt.type === 'error') {
          finishProgress();
          if (progressRow) progressRow.style.display = 'none';
          fullText += '\n❌ 错误：' + evt.message;
          responseBubble.innerHTML = formatMd(fullText);
          scrollToBottom();
          return;
        }
      });
    })
    .catch(function(err) {
      // 网络错误/超时 — 区分上传 vs 流式
      finishProgress();
      if (progressRow) progressRow.style.display = 'none';
      if (hasAnswer && fullText) {
        // 已经收到了部分内容，追加断开提示
        fullText += '\n\n⚠️ 连接中断，但上方已显示部分审查结果。如需完整结果请重新发送。';
        responseBubble.innerHTML = formatMd(fullText);
      } else {
        responseBubble.innerHTML = formatMd(
          '❌ 连接中断：' + (err.message || '网络错误') +
          '\n\n💡 可能原因：\n1. 论文较长，审查耗时较久，连接超时\n2. 网络不稳定\n\n📝 建议：\n1. 稍后重试\n2. 如果论文很长，可先尝试输入"简要质检"\n3. 刷新页面重新开始'
        );
      }
      scrollToBottom();
    });
  }

  /* ===== SSE 解析器（健壮版） ===== */
  function readSSE(resp, onEvent) {
    var reader = resp.body.getReader();
    var decoder = new TextDecoder();
    var buffer = '';

    function pump() {
      return reader.read().then(function(result) {
        if (result.done) return;
        buffer += decoder.decode(result.value, { stream: true });
        var lines = buffer.split('\n');
        buffer = lines.pop() || '';

        for (var i = 0; i < lines.length; i++) {
          var line = lines[i];
          if (line.indexOf('data: ') !== 0) continue;
          var jsonStr = line.slice(6).trim();
          if (!jsonStr) continue;
          try {
            var data = JSON.parse(jsonStr);
            var evt = parseSSEData(data);
            if (evt) onEvent(evt);
          } catch(e) { /* skip malformed JSON */ }
        }
        return pump();
      });
    }
    return pump();
  }

  /**
   * 解析 ServerMessage 结构:
   * { type: "answer", content: { answer: "..." } }
   * { type: "tool_request", content: { tool_request: { tool_name: "...", ... } } }
   * { type: "tool_response", content: { tool_response: { result: "...", ... } } }
   * { type: "message_end", content: { message_end: { code: "0", ... } } }
   * { type: "error", content: { error: { error_msg: "...", ... } } }
   */
  function parseSSEData(data) {
    var t = data.type;
    var c = data.content || {};

    if (t === 'answer') {
      var txt = '';
      if (typeof c.answer === 'string') txt = c.answer;
      else if (typeof c === 'string') txt = c;
      else if (typeof data.answer === 'string') txt = data.answer;
      else if (typeof data.text === 'string') txt = data.text;
      return txt ? { type: 'answer', text: txt } : null;
    }

    if (t === 'tool_request') {
      var tr = c.tool_request || {};
      var tn = tr.tool_name || tr.name || '';
      return { type: 'tool_request', toolName: tn };
    }

    if (t === 'tool_response') {
      var tr2 = c.tool_response || {};
      return { type: 'tool_response', toolName: tr2.tool_name || '', result: tr2.result || '' };
    }

    if (t === 'message_end') {
      var me = c.message_end || {};
      return { type: 'message_end', code: me.code || '0', message: me.message || '' };
    }

    if (t === 'error') {
      var er = c.error || {};
      var msg = er.error_msg || er.message || (typeof c === 'string' ? c : JSON.stringify(c));
      return { type: 'error', message: msg };
    }

    return null;
  }

  /* ===== textarea 自动高度 ===== */
  msgInput.addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 180) + 'px';
  });

})();
</script>
</body>
