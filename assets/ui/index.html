<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>法学论文质检自查智能体</title>
<style>
  /* ========== 色彩体系 (参考湘潭大学法学学部 #9F191E) ========== */
  :root {
    --xtu-primary: #9F191E;
    --xtu-primary-light: #C44549;
    --xtu-primary-pale: #F5E9E9;
    --xtu-primary-ghost: rgba(159,25,30,0.05);
    --xtu-accent-gold: #B8860B;
    --xtu-accent-gold-pale: #FAF5E6;
    --xtu-bg: #FAFAFA;
    --xtu-surface: #FFFFFF;
    --xtu-text: #2C2C2C;
    --xtu-text-secondary: #666666;
    --xtu-text-hint: #999999;
    --xtu-border: #E8E0E0;
    --xtu-shadow: 0 2px 16px rgba(159,25,30,0.06);
    --xtu-radius: 12px;
    --green: #2E7D32;
    --green-pale: #E8F5E9;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    font-family: "PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
    background: var(--xtu-bg);
    color: var(--xtu-text);
    font-size: 18px;
    line-height: 1.8;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ========== 顶部导航 ========== */
  .topbar {
    background: linear-gradient(135deg, var(--xtu-primary) 0%, #6B0F13 100%);
    padding: 0 32px;
    height: 64px;
    display: flex;
    align-items: center;
    gap: 20px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.12);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .topbar-logo {
    height: 44px;
    filter: brightness(0) invert(1);
  }
  .topbar-title {
    color: #fff;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 2px;
  }
  .topbar-subtitle {
    color: rgba(255,255,255,0.78);
    font-size: 14px;
    margin-left: auto;
    letter-spacing: 1px;
  }

  /* ========== 主内容区 ========== */
  .main-container {
    flex: 1;
    display: flex;
    flex-direction: column;
    max-width: 960px;
    width: 100%;
    margin: 0 auto;
    padding: 32px 24px 0;
  }

  /* ========== 欢迎区域 ========== */
  .welcome-section {
    text-align: center;
    padding: 48px 24px 36px;
  }
  .welcome-title {
    font-size: 32px;
    font-weight: 700;
    color: var(--xtu-primary);
    margin-bottom: 12px;
    letter-spacing: 3px;
  }
  .welcome-slogan {
    font-size: 20px;
    color: var(--xtu-text-secondary);
    letter-spacing: 1px;
    font-weight: 400;
  }
  .welcome-slogan::before,
  .welcome-slogan::after {
    content: " · ";
    color: var(--xtu-accent-gold);
  }

  /* ========== 图标装饰区 ========== */
  .deco-icons {
    display: flex;
    justify-content: center;
    gap: 40px;
    padding: 24px 0 32px;
    opacity: 0.18;
  }
  .deco-icons svg {
    width: 48px;
    height: 48px;
    stroke: var(--xtu-primary);
    fill: none;
    stroke-width: 1.2;
  }

  /* ========== 对话区 ========== */
  .chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 16px 0;
  }
  .msg-row {
    display: flex;
    margin-bottom: 20px;
    gap: 12px;
    animation: fadeIn 0.35s ease;
  }
  .msg-row.user { justify-content: flex-end; }
  .msg-row.assistant { justify-content: flex-start; }

  .msg-avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: 700;
    color: #fff;
  }
  .msg-row.user .msg-avatar { background: var(--xtu-accent-gold); }
  .msg-row.assistant .msg-avatar { background: var(--xtu-primary); }

  .msg-bubble {
    max-width: 72%;
    padding: 16px 20px;
    border-radius: var(--xtu-radius);
    font-size: 18px;
    line-height: 1.85;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg-row.user .msg-bubble {
    background: var(--xtu-primary);
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .msg-row.assistant .msg-bubble {
    background: var(--xtu-surface);
    color: var(--xtu-text);
    border: 1px solid var(--xtu-border);
    border-bottom-left-radius: 4px;
    box-shadow: var(--xtu-shadow);
  }
  .msg-bubble a {
    color: var(--xtu-primary);
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  /* ========== 输入区 ========== */
  .input-section {
    padding: 20px 0 28px;
    position: sticky;
    bottom: 0;
    background: linear-gradient(to top, var(--xtu-bg) 85%, transparent);
    z-index: 10;
  }
  .input-hint {
    text-align: center;
    font-size: 15px;
    color: var(--xtu-text-hint);
    margin-bottom: 10px;
    letter-spacing: 0.5px;
  }
  .input-hint strong {
    color: var(--xtu-primary);
    font-weight: 600;
  }
  .input-row {
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }

  /* ========== 上传按钮 ========== */
  .btn-upload {
    width: 56px;
    height: 56px;
    border-radius: var(--xtu-radius);
    border: 2px dashed var(--xtu-border);
    background: var(--xtu-surface);
    color: var(--xtu-text-hint);
    font-size: 26px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.25s;
    flex-shrink: 0;
    position: relative;
    user-select: none;
  }
  .btn-upload:hover {
    border-color: var(--xtu-primary-light);
    color: var(--xtu-primary);
  }
  /* 文件已选中状态 */
  .btn-upload.has-file {
    border-color: var(--green);
    border-style: solid;
    color: var(--green);
    background: var(--green-pale);
  }
  /* 隐藏原生 file input */
  .hidden-file-input {
    position: absolute;
    width: 0;
    height: 0;
    opacity: 0;
    pointer-events: none;
  }

  .input-wrapper {
    flex: 1;
    position: relative;
  }
  .input-wrapper textarea {
    width: 100%;
    min-height: 56px;
    max-height: 180px;
    padding: 14px 18px;
    font-size: 18px;
    line-height: 1.7;
    border: 2px solid var(--xtu-border);
    border-radius: var(--xtu-radius);
    background: var(--xtu-surface);
    color: var(--xtu-text);
    resize: none;
    outline: none;
    transition: border-color 0.2s;
    font-family: inherit;
  }
  .input-wrapper textarea:focus {
    border-color: var(--xtu-primary-light);
  }
  .input-wrapper textarea::placeholder {
    color: var(--xtu-text-hint);
  }

  .btn-send {
    width: 56px;
    height: 56px;
    border-radius: var(--xtu-radius);
    border: none;
    background: var(--xtu-primary);
    color: #fff;
    font-size: 22px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s, opacity 0.2s;
    flex-shrink: 0;
  }
  .btn-send:hover { background: var(--xtu-primary-light); }
  .btn-send:disabled { opacity: 0.4; cursor: not-allowed; }

  /* ========== 文件标签 — 显示在输入框上方 ========== */
  .file-preview {
    display: none;
    align-items: center;
    gap: 8px;
    background: var(--green-pale);
    border: 1px solid var(--green);
    border-radius: 8px;
    padding: 8px 14px;
    margin-bottom: 8px;
    font-size: 16px;
    color: var(--green);
    animation: fadeIn 0.3s ease;
  }
  .file-preview.visible {
    display: flex;
  }
  .file-preview-icon {
    font-size: 20px;
    flex-shrink: 0;
  }
  .file-preview-name {
    flex: 1;
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .file-preview-size {
    color: var(--xtu-text-hint);
    font-size: 14px;
    flex-shrink: 0;
  }
  .file-preview-remove {
    cursor: pointer;
    font-weight: 700;
    font-size: 18px;
    color: var(--xtu-text-hint);
    margin-left: 4px;
    transition: color 0.2s;
    flex-shrink: 0;
  }
  .file-preview-remove:hover {
    color: var(--xtu-primary);
  }

  /* ========== 加载动画 ========== */
  .typing-indicator span {
    display: inline-block;
    width: 8px;
    height: 8px;
    background: var(--xtu-primary-light);
    border-radius: 50%;
    margin: 0 3px;
    animation: bounce 1.4s infinite ease-in-out both;
  }
  .typing-indicator span:nth-child(1) { animation-delay: 0s; }
  .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
  .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes bounce {
    0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
    40% { transform: scale(1); opacity: 1; }
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ========== 拖拽高亮 ========== */
  .input-wrapper.drag-over textarea {
    border-color: var(--green);
    background: var(--green-pale);
  }

  /* ========== 响应式 ========== */
  @media (max-width: 640px) {
    .main-container { padding: 16px 12px 0; }
    .welcome-title { font-size: 24px; }
    .welcome-slogan { font-size: 16px; }
    .msg-bubble { max-width: 85%; font-size: 16px; }
    .topbar-title { font-size: 18px; }
    .topbar-subtitle { display: none; }
  }
</style>
</head>
<body>

<!-- ===== 顶部导航 ===== -->
<div class="topbar">
  <img src="https://law.xtu.edu.cn/v24/images/head/logo.png"
       alt="湘潭大学法学学部"
       class="topbar-logo"
       onerror="this.style.display='none'">
  <span class="topbar-title">法学论文质检自查智能体</span>
  <span class="topbar-subtitle">湘潭大学法学学部</span>
</div>

<!-- ===== 主内容 ===== -->
<div class="main-container">

  <!-- 欢迎区 -->
  <div class="welcome-section" id="welcomeSection">
    <div class="welcome-title">法学论文质检自查智能体</div>
    <div class="welcome-slogan">让沟通聚焦学术真问题，让论文写作提质增效</div>

    <!-- 浅色学术图示 -->
    <div class="deco-icons">
      <!-- 天平 (法律) -->
      <svg viewBox="0 0 24 24"><path d="M12 3v18M3 7l9-4 9 4M3 7l3 7h0a3 3 0 006 0h0l-3-7M21 7l-3 7h0a3 3 0 01-6 0h0l3-7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <!-- 书本 (学术) -->
      <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 016.5 17H20M4 19.5V5a2.5 2.5 0 012.5-2.5H20v15M4 19.5A2.5 2.5 0 006.5 22H20V7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <!-- 搜索 (审查) -->
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65" stroke-linecap="round"/></svg>
      <!-- 钢笔 (写作) -->
      <svg viewBox="0 0 24 24"><path d="M17 3a2.85 2.85 0 114 4L7.5 20.5 2 22l1.5-5.5Z" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
  </div>

  <!-- 对话区 -->
  <div class="chat-area" id="chatArea"></div>

  <!-- 输入区 -->
  <div class="input-section">
    <div class="input-hint">
      在此上传您的论文初稿，支持格式 <strong>.docx .pdf .txt .md</strong> &nbsp;|&nbsp;
      也可直接输入论文路径或文本内容
    </div>

    <!-- 文件预览条 (选中文件后显示) -->
    <div class="file-preview" id="filePreview">
      <span class="file-preview-icon">📄</span>
      <span class="file-preview-name" id="filePreviewName"></span>
      <span class="file-preview-size" id="filePreviewSize"></span>
      <span class="file-preview-remove" id="filePreviewRemove" title="移除文件">✕</span>
    </div>

    <div class="input-row">
      <!-- 上传按钮 (独立于 file input) -->
      <button class="btn-upload" id="btnUpload" type="button" title="上传论文文件">＋</button>
      <!-- 隐藏的 file input -->
      <input type="file" id="fileInput" class="hidden-file-input" accept=".docx,.pdf,.txt,.md">

      <div class="input-wrapper" id="inputWrapper">
        <textarea id="msgInput" rows="1" placeholder="请输入论文路径，或直接粘贴论文文本…"></textarea>
      </div>
      <button class="btn-send" id="btnSend" type="button" title="发送">➤</button>
    </div>
  </div>
</div>

<script>
(function() {
  'use strict';

  /* ========== DOM 引用 ========== */
  var chatArea      = document.getElementById('chatArea');
  var msgInput      = document.getElementById('msgInput');
  var btnSend       = document.getElementById('btnSend');
  var btnUpload     = document.getElementById('btnUpload');
  var fileInput     = document.getElementById('fileInput');
  var inputWrapper  = document.getElementById('inputWrapper');
  var filePreview   = document.getElementById('filePreview');
  var filePreviewName = document.getElementById('filePreviewName');
  var filePreviewSize = document.getElementById('filePreviewSize');
  var filePreviewRemove = document.getElementById('filePreviewRemove');
  var welcomeSection = document.getElementById('welcomeSection');

  /* ========== 状态 ========== */
  var pendingFile     = null;   // File 对象
  var pendingFilePath = null;   // 服务器返回的路径
  var sessionId       = genSid();
  var isSending       = false;

  /* ========== 工具函数 ========== */
  function genSid() {
    return 'sess_' + Math.random().toString(36).slice(2, 10);
  }

  function scrollToBottom() {
    chatArea.scrollTop = chatArea.scrollHeight;
  }

  function hideWelcome() {
    if (welcomeSection) welcomeSection.style.display = 'none';
  }

  function formatSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
  }

  function formatText(text) {
    if (typeof text !== 'string') return '';
    return text
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
      .replace(/`(.*?)`/g, '<code style="background:#f0f0f0;padding:2px 6px;border-radius:4px;font-size:0.9em">$1</code>')
      .replace(/\n/g, '<br>')
      .replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank">$1</a>');
  }

  /* ========== 消息渲染 ========== */
  function addMessage(role, text) {
    hideWelcome();
    var row = document.createElement('div');
    row.className = 'msg-row ' + role;
    var avatar = document.createElement('div');
    avatar.className = 'msg-avatar';
    avatar.textContent = role === 'user' ? '您' : '法';
    var bubble = document.createElement('div');
    bubble.className = 'msg-bubble';
    bubble.innerHTML = formatText(text);
    row.appendChild(avatar);
    row.appendChild(bubble);
    chatArea.appendChild(row);
    scrollToBottom();
    return bubble;
  }

  function addTypingIndicator() {
    hideWelcome();
    var row = document.createElement('div');
    row.className = 'msg-row assistant';
    row.id = 'typingRow';
    var avatar = document.createElement('div');
    avatar.className = 'msg-avatar';
    avatar.textContent = '法';
    var bubble = document.createElement('div');
    bubble.className = 'msg-bubble typing-indicator';
    bubble.innerHTML = '<span></span><span></span><span></span>';
    row.appendChild(avatar);
    row.appendChild(bubble);
    chatArea.appendChild(row);
    scrollToBottom();
  }

  function removeTypingIndicator() {
    var el = document.getElementById('typingRow');
    if (el) el.remove();
  }

  /* ========== 文件选择 — 核心修复 ========== */

  // 点击 + 按钮触发文件选择
  btnUpload.addEventListener('click', function() {
    // 先重置 value，确保同一文件也能触发 change
    fileInput.value = '';
    fileInput.click();
  });

  // 文件选中后 — 同时监听 change 和 input 事件（双保险）
  fileInput.addEventListener('change', onFileSelected);
  fileInput.addEventListener('input', onFileSelected);

  function onFileSelected(e) {
    var files = fileInput.files;
    if (!files || files.length === 0) {
      // 某些浏览器在取消选择时也会触发，此时忽略
      return;
    }
    var file = files[0];
    if (!file) return;

    pendingFile = file;
    pendingFilePath = null;

    // 更新 UI：文件预览条
    filePreviewName.textContent = file.name;
    filePreviewSize.textContent = formatSize(file.size);
    filePreview.classList.add('visible');

    // 更新 UI：+ 按钮变绿 ✓
    btnUpload.textContent = '✓';
    btnUpload.classList.add('has-file');

    // 更新 placeholder 提示
    msgInput.placeholder = '文件已就绪，点击发送开始审查，或输入补充说明…';

    // 聚焦到输入框方便用户输入补充说明
    msgInput.focus();
  }

  // 移除已选文件
  filePreviewRemove.addEventListener('click', clearFile);

  function clearFile() {
    pendingFile = null;
    pendingFilePath = null;
    fileInput.value = '';
    filePreview.classList.remove('visible');
    btnUpload.textContent = '＋';
    btnUpload.classList.remove('has-file');
    msgInput.placeholder = '请输入论文路径，或直接粘贴论文文本…';
  }

  /* ========== 拖拽上传 ========== */
  inputWrapper.addEventListener('dragover', function(e) {
    e.preventDefault();
    inputWrapper.classList.add('drag-over');
  });
  inputWrapper.addEventListener('dragleave', function() {
    inputWrapper.classList.remove('drag-over');
  });
  inputWrapper.addEventListener('drop', function(e) {
    e.preventDefault();
    inputWrapper.classList.remove('drag-over');
    var files = e.dataTransfer && e.dataTransfer.files;
    if (files && files.length > 0) {
      // 模拟 fileInput 选中
      pendingFile = files[0];
      pendingFilePath = null;
      filePreviewName.textContent = pendingFile.name;
      filePreviewSize.textContent = formatSize(pendingFile.size);
      filePreview.classList.add('visible');
      btnUpload.textContent = '✓';
      btnUpload.classList.add('has-file');
      msgInput.placeholder = '文件已就绪，点击发送开始审查，或输入补充说明…';
      msgInput.focus();
    }
  });

  /* ========== 上传文件到服务器 ========== */
  function uploadFileToServer(file) {
    var formData = new FormData();
    formData.append('file', file);
    return fetch('/upload', { method: 'POST', body: formData })
      .then(function(resp) {
        if (!resp.ok) throw new Error('上传失败 (HTTP ' + resp.status + ')');
        return resp.json();
      })
      .then(function(result) {
        if (result.success && result.file_path) {
          return result.file_path;
        } else {
          throw new Error(result.error || '上传返回异常');
        }
      });
  }

  /* ========== 发送消息 ========== */
  function sendMessage() {
    if (isSending) return;

    var text = msgInput.value.trim();
    var agentQuery = text;

    // 情况1：有待上传文件
    if (pendingFile) {
      isSending = true;
      btnSend.disabled = true;

      var fileName = pendingFile.name;
      addMessage('user', '📄 上传文件：' + fileName + (text ? '\n' + text : ''));
      addTypingIndicator();

      uploadFileToServer(pendingFile)
        .then(function(path) {
          removeTypingIndicator();
          pendingFilePath = path;
          agentQuery = '请审查这篇论文：' + path + (text ? '\n' + text : '');
          clearFile();
          return streamCall(agentQuery);
        })
        .catch(function(err) {
          removeTypingIndicator();
          addMessage('assistant', '❌ 文件上传失败：' + err.message + '\n请直接输入论文路径重试。');
          clearFile();
        })
        .finally(function() {
          isSending = false;
          btnSend.disabled = false;
        });

      msgInput.value = '';
      return;
    }

    // 情况2：纯文本
    if (!agentQuery) return;  // 没有文件也没有文字，静默返回

    isSending = true;
    btnSend.disabled = true;
    addMessage('user', agentQuery);
    msgInput.value = '';

    streamCall(agentQuery)
      .catch(function(err) {
        removeTypingIndicator();
        addMessage('assistant', '❌ 请求失败：' + err.message);
      })
      .finally(function() {
        isSending = false;
        btnSend.disabled = false;
      });
  }

  btnSend.addEventListener('click', sendMessage);
  msgInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  /* ========== 流式调用 (SSE) ========== */
  function streamCall(query) {
    var responseBubble = addMessage('assistant', '');
    var fullText = '';

    var payload = {
      type: 'query',
      session_id: sessionId,
      content: {
        query: {
          prompt: [{ type: 'text', content: { text: query } }]
        }
      }
    };

    return fetch('/stream_run', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    })
    .then(function(resp) {
      if (!resp.ok) throw new Error('服务器返回错误 (HTTP ' + resp.status + ')');
      return readSSEStream(resp, function(textChunk) {
        fullText += textChunk;
        responseBubble.innerHTML = formatText(fullText);
        scrollToBottom();
      });
    })
    .then(function() {
      removeTypingIndicator();
      if (!fullText) {
        responseBubble.innerHTML = formatText('审查完成，但未收到文本回复。请尝试重新发送。');
      } else {
        responseBubble.innerHTML = formatText(fullText);
      }
      scrollToBottom();
    });
  }

  function readSSEStream(resp, onChunk) {
    var reader = resp.body.getReader();
    var decoder = new TextDecoder();
    var buffer = '';

    return (function pump() {
      return reader.read().then(function(result) {
        if (result.done) return;

        buffer += decoder.decode(result.value, { stream: true });
        var lines = buffer.split('\n');
        buffer = lines.pop() || '';

        for (var i = 0; i < lines.length; i++) {
          var line = lines[i];
          if (line.indexOf('data: ') !== 0) continue;
          var jsonStr = line.slice(6).trim();
          if (!jsonStr) continue;

          try {
            var data = JSON.parse(jsonStr);
            var textChunk = extractText(data);
            if (textChunk) onChunk(textChunk);
          } catch(e) {
            // non-JSON line, skip
          }
        }

        return pump();
      });
    })();
  }

  function extractText(data) {
    // answer 事件
    if (data.type === 'answer') {
      if (data.content && typeof data.content.answer === 'string') return data.content.answer;
      if (typeof data.content === 'string') return data.content;
      if (typeof data.answer === 'string') return data.answer;
      if (typeof data.text === 'string') return data.text;
      return '';
    }
    // tool 事件
    if (data.type === 'tool_request' || data.type === 'tool_response') {
      var toolName = (data.content && data.content.tool_name)
        || (data.content && data.content.name) || '';
      return toolName ? '🔧 调用工具：' + toolName + '\n' : '';
    }
    // error 事件
    if (data.type === 'error') {
      var errMsg = '未知错误';
      if (data.content) {
        if (typeof data.content === 'string') errMsg = data.content;
        else if (data.content.error) {
          if (typeof data.content.error === 'string') errMsg = data.content.error;
          else if (data.content.error.message) errMsg = data.content.error.message;
        }
        else errMsg = JSON.stringify(data.content);
      }
      return '\n❌ 错误：' + errMsg;
    }
    return '';
  }

  /* ========== 自动调整 textarea 高度 ========== */
  msgInput.addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 180) + 'px';
  });

})();
</script>
